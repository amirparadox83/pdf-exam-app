name: persian_pdf_exam
description: اپلیکیشن آزمون PDF آفلاین فارسی RTL — MVP
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.7

  # Database (SQLite ORM)
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Code generation (runtime)
  collection: ^1.18.0

  # PDF engine
  pdfrx: ^1.0.110

  # Image processing — encode pdfrx RGBA page renders to PNG.
  # Used by PdfrxPdfEngine.renderPageToPng (Stage 12).
  image: ^4.2.0

  # Persian / RTL
  # persian_tools: ^1.0.2  # removed — not compatible with Dart 3.x (SDK <3.0.0)
  shamsi_date: ^1.1.1

  # Math formula rendering
  flutter_math_fork: ^0.7.2

  # Charts
  fl_chart: ^0.69.0

  # File picking & sharing
  file_picker: ^8.1.2
  share_plus: ^10.0.0

  # URL launcher
  url_launcher: ^6.3.0

  # Crypto
  cryptography: ^2.7.0
  crypto: ^3.0.5

  # Archiving for backups
  archive: ^3.6.1

  # UUID
  uuid: ^4.5.1

  # Misc
  intl: ^0.20.0
  logger: ^2.4.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  build_runner: ^2.4.13
  drift_dev: ^2.34.0
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  # build_verify: ^3.1.0  # removed — causes dependency resolution conflicts with flutter_test SDK

  # Test-only — for mocking path_provider in SettingsService / BackupService tests.
  path_provider_platform_interface: ^2.1.2

  # Test-only — for building synthetic PDFs in the PDF Engine integration test.
  # pdf: ^3.13.0  # removed — causes dependency conflict (requires archive ^4.x, conflicts with our ^3.6.1)

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/icons/
    - test_fixtures/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
