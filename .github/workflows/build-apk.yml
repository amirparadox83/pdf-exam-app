name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.9'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Ensure gradle-wrapper.jar exists
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing — downloading from Gradle 8.7 release..."
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
            ls -la gradle/wrapper/gradle-wrapper.jar
          else
            echo "gradle-wrapper.jar already present"
          fi

      - name: Download dependencies
        run: flutter pub get

      - name: Run codegen (drift / freezed / json_serializable / riverpod)
        run: dart run build_runner build --delete-conflicting-outputs || dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build split-per-abi APKs (optional, smaller per-arch)
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons
        continue-on-error: true

      - name: List built APKs
        run: |
          find build/app/outputs/flutter-apk -name "*.apk" -exec ls -la {} \;

      - name: Upload fat APK
        uses: actions/upload-artifact@v4
        with:
          name: persian-pdf-exam-fat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: persian-pdf-exam-split-apks
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Attach APKs to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
